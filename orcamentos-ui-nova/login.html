<!doctype html>
<html lang="pt-BR" class="ds-theme-indigo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar · Orçamentos</title>
<meta name="theme-color" content="#0f1115" />
<script>(function(){var e=document.documentElement;e.classList.add("js");try{var m=localStorage.getItem("ds-theme-mode");if(m==="dark"||((m==="auto"||!m)&&matchMedia("(prefers-color-scheme:dark)").matches))e.classList.add("ds-dark");}catch(x){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/stolben-ui.css" />
<link rel="stylesheet" href="assets/orca-theme.css" />
</head>
<body class="ds-root">
<div class="ds-segment ds-mode orca-login-theme" data-ds-theme-mode role="group" aria-label="Tema"><button type="button" data-mode="light" aria-label="Tema claro" title="Claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button><button type="button" data-mode="auto" aria-label="Tema automático" title="Automático"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button><button type="button" data-mode="dark" aria-label="Tema escuro" title="Escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg></button></div>
<div class="login-split">

  <!-- PAINEL DA MARCA -->
  <aside class="login-brand ds-panel-dark">
    <div class="ds-media" aria-hidden="true" style="position:absolute;inset:0"><img src="img/orcamentos-login.jpg" alt="" width="1200" height="800" style="width:100%;height:100%;object-fit:cover" /><div class="ds-media-grad"></div></div>
    <div class="ds-glow" aria-hidden="true"></div>
    <div style="position:relative;z-index:1">
      <div class="ds-row" style="gap:.6rem;align-items:center;margin-bottom:auto"><strong style="color:#fff;font-family:var(--ds-font-display)">Orçamentos</strong></div>
    </div>
    <div style="position:relative;z-index:1;margin-top:auto">
      <span class="ds-kicker">Stölben</span>
      <h1 class="ds-display" style="font-size:clamp(1.6rem,3vw,2.2rem);color:#fff;margin:.4rem 0 .6rem">Orçamentos profissionais, <span class="ds-muted">do rascunho ao PDF.</span></h1>
      <p style="color:var(--ds-on-dark-dim);max-width:42ch">Catálogo de itens, clientes, ajustes por categoria e geração de relatórios. Tudo num lugar só.</p>
    </div>
  </aside>

  <!-- FORMULÁRIO -->
  <main class="login-main">
    <div class="login-card">
      <div style="margin-bottom:1.5rem">
        <h2 class="ds-h2" style="font-size:1.5rem">Entrar</h2>
        <p style="color:var(--ds-t-500)">Acesse a sua conta para continuar.</p>
      </div>

      <form action="dashboard.html">
        <div class="ds-field"><label class="ds-label" for="l-user">Usuário ou e-mail</label><input class="ds-input" id="l-user" name="username" autocomplete="username" inputmode="email" spellcheck="false" placeholder="seu.usuario@empresa.com" /></div>
        <div class="ds-field">
          <div class="ds-row" style="justify-content:space-between"><label class="ds-label" for="l-pass">Senha</label><a href="#" style="font-size:.82rem;color:var(--ds-accent-fg)">Esqueci a senha</a></div>
          <input class="ds-input" id="l-pass" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <label class="ds-switch" style="margin:.25rem 0 1.25rem"><input type="checkbox" /><span class="ds-switch-track"></span> Manter conectado</label>
        <button class="ds-btn ds-btn--solid ds-btn--block ds-btn--lg" type="submit">Entrar</button>
      </form>

      <div style="text-align:center;margin-top:1.25rem"><a class="ds-btn ds-btn--ghost ds-btn--sm" href="dashboard.html">Entrar como visitante</a></div>
    </div>
    <p class="login-foot">Um app <a href="https://stolben.com/" target="_blank" rel="noopener">Stölben</a> · &copy; 2026</p>
  </main>
</div>

<style>
  .login-split{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
  .login-brand{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:clamp(1.5rem,3vw,2.75rem)}
  .login-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem 1.25rem;background:var(--ds-bg)}
  .login-card{width:100%;max-width:24rem;background:var(--ds-surface);border:1px solid var(--ds-line);border-radius:var(--ds-radius-lg);padding:clamp(1.5rem,3vw,2rem);box-shadow:var(--ds-shadow-card)}
  .login-foot{color:var(--ds-t-500);font-size:.82rem}
  @media (max-width:820px){.login-split{grid-template-columns:1fr}.login-brand{display:none}}
</style>

<script src="assets/stolben-ui.js"></script>
<script>document.querySelectorAll("a svg, button svg").forEach(function(s){s.setAttribute("aria-hidden","true");s.setAttribute("focusable","false");});</script>
</body>
</html>
