name: CI

# O pipeline vive em github.com/rigst/ci. Ajuste lá vale para todos os projetos.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: rigst/ci/.github/workflows/static-site.yml@566c2d8c37ca30f390bcd4dc5f1c6e03014cbd4f # v1
    with:
      # Sem a11y-paths o job audita todo *.html do repositório: a página do
      # site, o protótipo de UI do orçamentos e as telas do design system.
      #
      # O passivo foi medido com `none`, zerado nos tokens do DS e confirmado
      # em oito auditorias seguidas sem oscilação. Por isso o portão já entra
      # apertado: qualquer achado `serious` reprova.
      run-a11y: true
      a11y-fail-on: serious

      # --- qualidade (primeira rodada: medir, não bloquear) ---
      #
      # Num site sem build, o CSS e o JS são o produto: não há etapa de
      # compilação para pegar erro antes, e esta é a única verificação
      # possível. `frontend-paths` fica no padrão `.` porque aqui não há
      # venv/ para varrer — diferente dos projetos Django.
      #
      # Passivo medido em 2026-09-10: 3 achados de Stylelint e 6 avisos de
      # ESLint, nenhum erro. Ainda assim entra em soft-fail, pela regra de
      # medir antes de apertar.
      run-frontend: true
      frontend-fail-on: erro

      # As 18 páginas são enumeradas, e não descobertas, por causa de uma só:
      # `orcamentos-ui-nova/orcamento-form.html` rola 362px de lado a 390px de
      # viewport e fica de fora até ser revista.
      #
      # A causa está medida: um `div` sem classe, com `display:grid` inline,
      # cuja coluna resolve para 728px dentro de um contêiner de 342px — o
      # mínimo vem do conteúdo do `.ds-card`, que não encolhe. Não é conserto de
      # uma linha de CSS, é revisão da estrutura daquela tela, e tentar às cegas
      # num protótipo de design sem cobertura visual custa mais do que resolve.
      #
      # A página irmã, `orcamento-detalhe.html`, tinha o mesmo sintoma e foi
      # corrigida de verdade neste PR: `min-width: 0` nos itens de grid, para a
      # tabela larga rolar dentro do `.ds-table-wrap` em vez de empurrar a
      # página. Ficou limpa nas três larguras.
      run-layout: true
      layout-fail-on: erro
      layout-paths: |
        /design-systems/stolben-ui-v1/index.html
        /design-systems/stolben-ui-v1/templates/01-admin-tabela.html
        /design-systems/stolben-ui-v1/templates/02-catalogo-cards.html
        /design-systems/stolben-ui-v1/templates/03-board-colunas.html
        /design-systems/stolben-ui-v2/index.html
        /design-systems/stolben-ui-v2/templates/01-entrada.html
        /design-systems/stolben-ui-v2/templates/02-lista.html
        /design-systems/stolben-ui-v2/templates/03-ficha.html
        /index.html
        /orcamentos-ui-nova/categorias.html
        /orcamentos-ui-nova/clientes.html
        /orcamentos-ui-nova/dashboard.html
        /orcamentos-ui-nova/empresa.html
        /orcamentos-ui-nova/index.html
        /orcamentos-ui-nova/itens.html
        /orcamentos-ui-nova/login.html
        /orcamentos-ui-nova/orcamento-detalhe.html
        /orcamentos-ui-nova/orcamentos.html

      # As duas etapas entraram toleradas em 10/09/2026 e saíram no mesmo dia.
      soft-fail: ""

  sonar:
    name: SonarQube Cloud
    needs: [ci]
    if: always() && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # O Sonar usa o blame do git para atribuir "código novo" — precisa do
      # histórico inteiro, senão toda linha vira responsabilidade do último commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=rigst_site_stolben
            -Dsonar.organization=rigst
            -Dsonar.exclusions=**/node_modules/**,**/*.jpg,**/*.jpeg,**/*.png,**/*.gif,**/*.ico,**/*.webp,**/*.pdf,**/*.woff,**/*.woff2,**/*.ttf,**/*.eot
