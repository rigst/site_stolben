# Cabeçalhos de segurança do stolben.com (site estático, servido direto pelo nginx).
#
# Versionado aqui porque o site não tem backend: quem manda os cabeçalhos é o
# nginx. Instalação (uma vez, com sudo), descrita em docs/README.md:
#
#   sudo cp /var/www/site_stolben/deploy/nginx-seguranca.conf /etc/nginx/snippets/stolben-seguranca.conf
#   # no server{} 443 de /etc/nginx/sites-available/site_stolben:
#   #   include /etc/nginx/snippets/stolben-seguranca.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# CSP: tudo é do próprio domínio. O único script inline é o que marca a página
# como "js" antes do CSS carregar (evita o pisca do conteúdo sem JS); ele entra
# por hash, então editar o script exige recalcular:
#   printf '%s' 'document.documentElement.classList.add("js")' | openssl dgst -sha256 -binary | base64
# `connect-src 'self'` cobre o fetch do /status.json.
#
# Atenção: `add_header` num `location` substitui todos os do `server`. Se um
# `location` ganhar add_header próprio, inclua este snippet nele também.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qOhFsq0QMV2REqNwk5hGH5bZE9SkX6gt6yeyKdYPv+U='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
